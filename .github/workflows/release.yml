name: Release

# Push a tag like v1.2.0 to publish Beam-1.2.0.dmg and Beam-1.2.0.pkg as a GitHub release.
# Run it manually to get the packages as a workflow artifact without releasing.
#
# Signing and notarization are optional. Without these secrets the app is ad-hoc
# signed and users have to right-click > Open on first launch.
#   MACOS_CERTIFICATE_P12         base64 .p12 with "Developer ID Application" and "Developer ID Installer"
#   MACOS_CERTIFICATE_PASSWORD    password for that .p12
#   APPLE_TEAM_ID                 e.g. ABCDE12345
#   APPLE_ID / APPLE_APP_PASSWORD Apple ID and app-specific password for notarization

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
      BUILD_NUMBER: ${{ github.run_number }}
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test --build-path work/test

      - name: Import signing certificates
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_IDENTITY=Developer ID Application: $(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"Developer ID Application: \(.*\)"/\1/p' | head -1)" >> "$GITHUB_ENV"
          echo "INSTALLER_SIGN_IDENTITY=Developer ID Installer: $(security find-identity -v "$KEYCHAIN" | sed -n 's/.*"Developer ID Installer: \(.*\)"/\1/p' | head -1)" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials beam --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APPLE_APP_PASSWORD"
            echo "NOTARY_PROFILE=beam" >> "$GITHUB_ENV"
          fi

      - name: Build app
        run: ./scripts/build-app.sh

      - name: Package .dmg and .pkg
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Beam-${{ env.VERSION }}
          path: |
            outputs/*.dmg
            outputs/*.pkg
            outputs/SHA256SUMS.txt

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            outputs/*.dmg
            outputs/*.pkg
            outputs/SHA256SUMS.txt
